name: Release

# Pushing a vX.Y.Z tag on main builds the Windows exe and publishes a GitHub
# Release with it. See README, "Releasing".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: windows-latest
    permissions:
      contents: write   # create the release and upload its assets
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Ship first, then tag main."
            exit 1
          fi

      - name: Check the tag matches __version__
        id: version
        run: |
          # tr: the Windows checkout may have CRLF line endings.
          version=$(tr -d '\r' < src/app/__init__.py | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ \"$version\" in src/app/__init__.py."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 3.14 matches the owner's build machine. python-rtmidi has no 3.14
      # wheel, so it compiles here with the runner's MSVC.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements-lock.txt -r src/requirements-build.txt

      - name: Build the exe
        working-directory: src
        run: pyinstaller --noconfirm app.spec

      - name: Name the asset and write checksums
        id: asset
        working-directory: src/dist
        run: |
          exe="VideoCues-${{ steps.version.outputs.version }}-win64.exe"
          mv VideoCues.exe "$exe"
          sha256sum "$exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        working-directory: src/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: LiveCues VideoCues ${{ steps.version.outputs.version }}
          EXE: ${{ steps.asset.outputs.exe }}
        run: >
          gh release create "$TAG" "$EXE" SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "$TITLE"
          --generate-notes
          --verify-tag
