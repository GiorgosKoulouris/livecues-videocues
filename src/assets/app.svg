<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Video Cues app icon: play (video) + cue timeline. Slate dark / cyan accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEAF7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000510" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="16" y="16" width="480" height="240" rx="112" fill="#FFFFFF" opacity="0.05"/>

  <!-- cue timeline with markers (cyan = active cue) -->
  <rect x="120" y="372" width="272" height="14" rx="7" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="150" cy="379" r="15" fill="#FFFFFF" opacity="0.50"/>
  <circle cx="256" cy="379" r="20" fill="#22D3EE"/>
  <circle cx="362" cy="379" r="15" fill="#FFFFFF" opacity="0.50"/>

  <!-- play triangle (video) -->
  <path filter="url(#sh)" fill="url(#play)"
        d="M201 150
           a26 26 0 0 1 39 -22
           l118 70
           a26 26 0 0 1 0 45
           l-118 70
           a26 26 0 0 1 -39 -22
           Z"/>
</svg>
