services:
  dev:
    container_name: miditrigger-devcontainer

    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace
      - venv:/workspace/.venv
      - cache:/home/vscode/.cache/pip
      - claude:/home/vscode/.claude

    tty: true

volumes:
  venv:
  cache:
  claude: