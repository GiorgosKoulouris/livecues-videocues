services:
  dev:
    container_name: videocues-devcontainer

    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspace
      - claude:/home/vscode/.claude
      - ${CLAUDE_SKILLS_DIR:-D:/Projects/Other/ClaudeSkills}:/home/vscode/.claude/skills

    tty: true

volumes:
  claude: